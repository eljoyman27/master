{% extends "base.html" %}
{% block content %}
<h2>Add Maintenance Record</h2>
<form method="post" class="form">
  <label>Asset
    <select name="asset_id" required>
      {% for a in assets %}<option value="{{ a.id }}">{{ a.name }}</option>{% endfor %}
    </select>
  </label>
  <label>Task <input name="task" placeholder="Oil change, filter check, tire rotation..." required></label>
  <label>Last Done <input type="date" name="last_done"></label>
  <label>Due Date <input type="date" name="due_date"></label>
  <label>Current Mileage / Hours <input type="number" name="mileage"></label>
  <label>Due Mileage / Hours <input type="number" name="due_mileage"></label>
  <label>Cost <input type="number" step="0.01" name="cost" value="0"></label>
  <label>Notes <textarea name="notes"></textarea></label>
  <button type="submit">Save Maintenance</button>
</form>
{% endblock %}
