{% extends "base.html" %}
{% block content %}
<div class="page-actions"><a class="button" href="{{ url_for('new_asset') }}">+ Add Asset</a></div>
<table>
  <thead><tr><th>Name</th><th>Category</th><th>Year</th><th>Make/Model</th><th>Notes</th></tr></thead>
  <tbody>
  {% for a in assets %}
    <tr><td>{{ a.name }}</td><td>{{ a.category }}</td><td>{{ a.year }}</td><td>{{ a.make_model }}</td><td>{{ a.notes }}</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
